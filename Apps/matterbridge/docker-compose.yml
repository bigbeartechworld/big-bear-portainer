# Configuration for matterbridge setup

# Application Name
# Services used in the application
services:
  # The `big-bear-matterbridge` service for the Matterbridge application
  big-bear-matterbridge:
    # Name of the container
    container_name: big-bear-matterbridge
    # Docker image to be used
    image: luligu/matterbridge:3.10.12@sha256:da28a7789ca91ceae164c6e3bd18cd36b8e67cd20a423919a27520a7012ef47c
    # Restart policy for the service
    restart: unless-stopped
    # Network mode set to host for Matter mdns support
    network_mode: host
    # Volume mappings for persistent storage
    volumes:
      - big-bear-matterbridge_Matterbridge:/root/Matterbridge
      - big-bear-matterbridge_.matterbridge:/root/.matterbridge
volumes:
  big-bear-matterbridge_.matterbridge:
    name: big-bear-matterbridge_.matterbridge
    driver: local
  big-bear-matterbridge_Matterbridge:
    name: big-bear-matterbridge_Matterbridge
    driver: local
